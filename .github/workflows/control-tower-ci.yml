name: Control Tower CI

on:
  push:
    branches: ["main", "foundation/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm install

      - name: TypeScript / Next build
        run: npm run build
        env:
          AUTH_SECRET: ci-placeholder
          AUTH_GOOGLE_ID: ci-placeholder
          AUTH_GOOGLE_SECRET: ci-placeholder
          BBK_ALLOWED_EMAILS_JSON: '{"ci@example.com":"ADMIN"}'
          BBK_INVENTORY_SOURCE: "mock"
